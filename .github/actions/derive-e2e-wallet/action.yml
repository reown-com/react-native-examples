name: Derive E2E test wallet
description: >-
  Derives one platform's funded E2E test wallet (m/44'/60'/0'/0/<index>) from the
  shared TEST_WALLET_MNEMONIC. Each E2E leg gets its own account, so concurrent
  legs never share a Polygon nonce or a USDT Permit2 allowance.
inputs:
  mnemonic:
    description: 'BIP-39 mnemonic (secrets.TEST_WALLET_MNEMONIC).'
    required: true
  index:
    description: 'Account index: 0 = Android, 1 = iOS, 2 = web.'
    required: true
  expected-address:
    description: >-
      The funded address for this index (vars.TEST_WALLET_ADDRESS_<PLATFORM>).
      When set, a mismatch fails the job instead of running against an unfunded
      account.
    required: false
    default: ''
outputs:
  private-key:
    description: 'Derived private key (masked in logs).'
    value: ${{ steps.derive.outputs.private-key }}
  address:
    description: 'Derived address.'
    value: ${{ steps.derive.outputs.address }}

runs:
  using: composite
  steps:
    # A pinned, checksum-verified cast instead of foundry-toolchain: its
    # installer resolves "latest" and fetches extra release files with no retry,
    # so one GitHub 500 failed a whole E2E leg. Only cast is needed here.
    - name: Install cast (Foundry)
      shell: bash
      env:
        FOUNDRY_VERSION: v1.8.3
      run: |
        set -euo pipefail
        case "$RUNNER_OS-$RUNNER_ARCH" in
          macOS-ARM64)
            ASSET=darwin_arm64
            SHA256=562f9c2f9094e512f1efc1e005c79de7642c27ffc1e7e9dcf8e31baa54577d6e ;;
          Linux-X64)
            ASSET=linux_amd64
            SHA256=7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568 ;;
          *)
            echo "::error::No pinned Foundry build for $RUNNER_OS-$RUNNER_ARCH"
            exit 1 ;;
        esac
        DIR="$RUNNER_TEMP/foundry"
        mkdir -p "$DIR"
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$DIR/foundry.tar.gz" \
          "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/foundry_${FOUNDRY_VERSION}_${ASSET}.tar.gz"
        echo "$SHA256  $DIR/foundry.tar.gz" | shasum -a 256 -c -
        tar -xzf "$DIR/foundry.tar.gz" -C "$DIR" cast
        rm "$DIR/foundry.tar.gz"
        echo "$DIR" >> "$GITHUB_PATH"
        "$DIR/cast" --version

    - name: Derive wallet
      id: derive
      shell: bash
      env:
        MNEMONIC: ${{ inputs.mnemonic }}
        INDEX: ${{ inputs.index }}
        EXPECTED_ADDRESS: ${{ inputs.expected-address }}
      run: |
        set -euo pipefail
        if [ -z "$MNEMONIC" ]; then
          echo "::error::TEST_WALLET_MNEMONIC is not set (fork PRs don't get secrets)."
          exit 1
        fi
        if ! [[ "$INDEX" =~ ^[0-9]+$ ]]; then
          echo "::error::index must be a non-negative integer, got '$INDEX'."
          exit 1
        fi
        # cast reads the mnemonic from a file, so neither the mnemonic nor the
        # derived key ever appears on a command line.
        MNEMONIC_FILE="$(mktemp "$RUNNER_TEMP/mnemonic.XXXXXX")"
        trap 'rm -f "$MNEMONIC_FILE"' EXIT
        printf '%s' "$MNEMONIC" > "$MNEMONIC_FILE"
        DERIVATION_PATH="m/44'/60'/0'/0/$INDEX"
        PRIVATE_KEY="$(cast wallet private-key --mnemonic "$MNEMONIC_FILE" --mnemonic-derivation-path "$DERIVATION_PATH")"
        echo "::add-mask::$PRIVATE_KEY"
        ADDRESS="$(cast wallet address --mnemonic "$MNEMONIC_FILE" --mnemonic-derivation-path "$DERIVATION_PATH")"
        lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
        if [ -n "$EXPECTED_ADDRESS" ] && [ "$(lower "$ADDRESS")" != "$(lower "$EXPECTED_ADDRESS")" ]; then
          echo "::error::Derived $ADDRESS at $DERIVATION_PATH, expected $EXPECTED_ADDRESS. Check the mnemonic secret and the TEST_WALLET_ADDRESS_* variable."
          exit 1
        fi
        echo "private-key=$PRIVATE_KEY" >> "$GITHUB_OUTPUT"
        echo "address=$ADDRESS" >> "$GITHUB_OUTPUT"
        echo "E2E wallet ($DERIVATION_PATH): $ADDRESS"
