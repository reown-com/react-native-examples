name: 🚀 Release Mobile POS
run-name: "Mobile POS - ${{ inputs.platform == 'both' && '🍎 iOS & 🤖 Android' || inputs.platform == 'ios' && '🍎 iOS' || '🤖 Android' }} (${{ inputs.release-type || 'internal' }})"

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - both
          - android
          - ios
      release-type:
        description: 'Release type'
        required: false
        default: internal
        type: choice
        options:
          - internal
          - production
  push:
    tags:
      - 'variant-*'

jobs:
  release-android:
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'both' }}
    uses: ./.github/workflows/release-android-base.yaml
    with:
      name: 'Mobile POS React Native'
      root-path: 'dapps/pos-app'
      release-type: ${{ inputs.release-type == 'production' && 'production' || 'internal' }}
      project-type: 'dapp'
      output-path: ${{ inputs.release-type == 'production' && 'dapps/pos-app/android/app/build/outputs/apk/release/app-release.apk' || 'dapps/pos-app/android/app/build/outputs/apk/internal/app-internal.apk' }}
      package-manager: 'npm'
      is-expo-project: true
      firebase-app-id: ${{ inputs.release-type == 'production' && vars.POS_ANDROID_FIREBASE_APP_ID || vars.POS_ANDROID_INTERNAL_FIREBASE_APP_ID }}
    secrets:
      env-file: ${{ secrets.POS_ENV_FILE }}
      sentry-file: ${{ secrets.POS_SENTRY_FILE }}
      secrets-file: ${{ secrets.ANDROID_SECRETS_FILE }}
      gsa-key: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      keystore-name: ${{ inputs.release-type == 'production' && vars.WC_PROD_KEYSTORE_NAME || vars.WC_INTERNAL_KEYSTORE_NAME }}
      keystore: ${{ inputs.release-type == 'production' && secrets.WC_PROD_KEYSTORE || secrets.WC_INTERNAL_KEYSTORE }}
      aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
      firebase-url: ${{ inputs.release-type == 'production' && vars.FIREBASE_POS_URL || vars.FIREBASE_POS_INTERNAL_URL }}

  release-ios:
    if: ${{ github.event_name != 'push' && (inputs.platform == 'ios' || inputs.platform == 'both') }}
    uses: ./.github/workflows/release-ios-base.yaml
    with:
      name: 'Mobile POS React Native'
      root-path: 'dapps/pos-app'
      release-type: ${{ inputs.release-type == 'production' && 'production' || 'internal' }}
      app-variant: ${{ inputs.release-type == 'production' && 'production' || 'internal' }}
      scheme-name: ${{ inputs.release-type == 'production' && 'WPay' || 'WPayDev' }}
      bundle-id: ${{ inputs.release-type == 'production' && 'com.reown.mobilepos' || 'com.reown.mobilepos.internal' }}
      apple-id: ${{ inputs.release-type == 'production' && '6754570257' || vars.POS_IOS_INTERNAL_APPLE_ID }}
      project-type: 'dapp'
      package-manager: 'npm'
      testflight-groups: ${{ inputs.release-type == 'production' && 'External' || 'Internal' }}
      is-expo-project: true
    secrets:
      env-file: ${{ secrets.POS_ENV_FILE }}
      sentry-file: ${{ secrets.POS_SENTRY_FILE }}
      apple-username: ${{ secrets.APPLE_USERNAME }}
      apple-key-id: ${{ secrets.APPLE_KEY_ID }}
      apple-key-content: ${{ secrets.APPLE_KEY_CONTENT }}
      apple-issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
      match-username: ${{ secrets.MATCH_USERNAME }}
      match-keychain-password: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      match-git-url: ${{ secrets.MATCH_GIT_URL }}
      match-ssh-key: ${{ secrets.MATCH_SSH_KEY }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
      testflight-url: ${{ inputs.release-type == 'production' && vars.TESTFLIGHT_POS_URL || vars.TESTFLIGHT_POS_INTERNAL_URL }}
