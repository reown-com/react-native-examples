# Flow 7 — restore sessions: after a full app restart (no clearState), the
# wallet rehydrates its active sessions from storage.
appId: ${APP_ID}
tags:
  - relay-walletkit
  - restore
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: _connect_walletkit.yaml
# Full stop + relaunch WITHOUT clearing state -> exercises session restore.
- stopApp
- launchApp:
    clearState: false
- tapOn: 'Connected apps'
- extendedWaitUntil:
    visible:
      id: 'session-item'
    timeout: 30000
