# Mirror Flow 6 — disconnect from the wallet side: the web wallet tears down the
# session; the native appkit dapp receives session_delete.
appId: ${APP_ID}
tags:
  - relay-appkit
  - disconnect-wallet
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: _connect_appkit.yaml
# Web wallet is foreground after connect: open the connected app's detail.
- tapOn: 'Connected apps'
- tapOn:
    id: 'session-item'
- extendedWaitUntil:
    visible:
      id: 'session-disconnect-button'
    timeout: 30000
- tapOn:
    id: 'session-disconnect-button'
- assertVisible: 'No connected apps yet'
# Dapp side reflects the disconnect.
- launchApp
- extendedWaitUntil:
    notVisible:
      id: 'dapp-connected'
    timeout: 30000
