# Mirror Flow 3 — switch chain: native appkit switches network (client-side; all
# EVM chains are in the approved namespaces, so no wallet interaction).
appId: ${APP_ID}
tags:
  - relay-appkit
  - switch-chain
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: _connect_appkit.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dapp-connected'
    timeout: 30000
# Open the AppKit network selector and pick Polygon (see switch_chain.yaml notes).
- tapOn: 'NetworkButton'
- tapOn: 'Polygon'
- extendedWaitUntil:
    visible:
      id: 'connected-chain'
    timeout: 30000
- assertVisible: 'Chain: Polygon'
