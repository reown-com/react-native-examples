# Flow 5 — disconnect from the dapp side: dapp tears down the session; the
# wallet receives session_delete and drops it. Uses the dapp's TEST_MODE
# "Disconnect (E2E)" button (the AppKit account button isn't text-matchable on web).
appId: ${APP_ID}
tags:
  - relay-walletkit
  - disconnect-dapp
---
- runFlow: _connect_walletkit.yaml
- extendedWaitUntil:
    visible: 'Connected to'
    timeout: 60000
# Disconnect from the dapp.
- tapOn: 'Disconnect (E2E)'
- extendedWaitUntil:
    notVisible: 'Connected to'
    timeout: 30000
# Wallet side dropped the session too (session_delete over the relay).
- launchApp:
    appId: ${APP_ID}
- tapOn: 'Connected apps'
- extendedWaitUntil:
    visible: 'No connected apps yet'
    timeout: 30000
