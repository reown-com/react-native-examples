# Mirror Flow 7 — restore sessions: after a full restart (no clearState) the
# native appkit dapp rehydrates its active session from storage.
appId: ${APP_ID}
tags:
  - relay-appkit
  - restore
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: _connect_appkit.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dapp-connected'
    timeout: 30000
# Full stop + relaunch WITHOUT clearing state -> exercises session restore.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: 'dapp-connected'
    timeout: 30000
