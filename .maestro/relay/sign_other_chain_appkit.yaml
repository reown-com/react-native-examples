# Mirror Flow 4 — sign a message on another chain: switch chain on the native
# dapp, then personal_sign approved in the web wallet.
appId: ${APP_ID}
tags:
  - relay-appkit
  - sign-other-chain
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: _connect_appkit.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dapp-connected'
    timeout: 30000
- tapOn: 'NetworkButton'
- tapOn: 'Polygon'
- assertVisible: 'Chain: Polygon'
- tapOn:
    id: 'sign-message-button'
- openLink:
    link: ${WALLET_URL}
    browser: true
- extendedWaitUntil:
    visible:
      id: 'approve-button'
    timeout: 30000
- tapOn:
    id: 'approve-button'
- launchApp
- extendedWaitUntil:
    visible:
      id: 'sign-result'
    timeout: 30000
- assertVisible: 'Sign success'
