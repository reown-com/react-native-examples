# Mirror Flow 5 — disconnect from the dapp side: the native appkit dapp tears
# down the session; the web wallet receives session_delete.
appId: ${APP_ID}
tags:
  - relay-appkit
  - disconnect-dapp
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow: _connect_appkit.yaml
- launchApp
- extendedWaitUntil:
    visible:
      id: 'dapp-connected'
    timeout: 30000
# Open the AppKit account view and disconnect (see disconnect_dapp.yaml notes).
- tapOn:
    id: 'dapp-connected'
- tapOn: 'Disconnect'
- extendedWaitUntil:
    notVisible:
      id: 'dapp-connected'
    timeout: 30000
# Web wallet dropped the session too.
- openLink:
    link: ${WALLET_URL}
    browser: true
- tapOn: 'Connected apps'
- assertVisible: 'No connected apps yet'
