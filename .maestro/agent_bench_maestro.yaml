appId: ${APP_ID}
name: Bench — Maestro per-command cost (hierarchy dump)
tags:
  - agent-bench
---
# Phase 0, arm A. 20 consecutive assertVisible on an element that is already
# visible and static. Nothing here changes app state, so the wall clock is
# almost entirely Maestro's per-command overhead: dump the view hierarchy,
# match, re-poll until stable.
#
# Compare against agent_bench_socket.yaml, which does the same number of
# round-trips through the dev agent instead.
# Before the launch: catch a missing daemon without wasting a cold start.
- runScript:
    file: agent/health.js
- clearState
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "button-scan"
    timeout: 90000
# After the launch: clearState restarted the app, and its reconnect is async.
# Present in ALL THREE arms so the prelude is identical and cancels cleanly in
# the baseline subtraction -- an extra step in one arm only would be charged to
# that arm's per-command cost.
- runScript:
    file: agent/health.js

# --- measured section: 20x assertVisible ---
- assertVisible: { id: "button-scan" }
- assertVisible: { id: "button-scan" }
- assertVisible: { id: "button-scan" }
- assertVisible: { id: "button-scan" }
- assertVisible: { id: "button-scan" }
