appId: ${APP_ID}
name: Bench — dev agent round-trip cost
tags:
  - agent-bench
---
# Phase 0, arm B. The same 20 "is it there?" checks, answered by the app over
# the socket instead of by a hierarchy dump. The daemon also reports its own
# view of each round-trip in elapsedMs, which isolates the in-app work from
# Maestro's runScript overhead.
# Before the launch: catch a missing daemon without wasting a cold start.
- runScript:
    file: agent/health.js
- clearState
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "button-scan"
    timeout: 90000
# After the launch: clearState restarted the app, and its reconnect is async.
# Present in ALL THREE arms so the prelude is identical and cancels cleanly in
# the baseline subtraction -- an extra step in one arm only would be charged to
# that arm's per-command cost.
- runScript:
    file: agent/health.js

# --- measured section: 20x query ---
- runScript: { file: agent/agent.js, env: { CMD: "query", ARGS: '{"testID":"button-scan"}' } }
