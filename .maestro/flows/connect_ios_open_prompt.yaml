appId: ${APP_ID}
---
# Shared flow (iOS only): the first time one app opens another by custom
# scheme (dApp -> wallet to pair or send a request, wallet -> dApp after
# answering), iOS asks "Open in “<App>”?". Confirm it if it shows up.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Open in .*"
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible: "Open in .*"
          commands:
            - tapOn: "Open"
