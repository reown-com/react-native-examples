appId: ${APP_ID}
---
# Shared flow: turn off SIWX (Sign In With X) in the dApp's settings, which is
# on by default. With it on, connecting adds a "Sign in" signature step; the
# connect flows cover connect and personal_sign on their own, so keep it off.
# AppKit reads the setting once at startup, so the dApp is restarted after
# changing it.
# Right after launch the tab bar can ignore a tap; retry until Settings opens.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "tab-settings"
      # By id: on iOS the card's title and subtitle form one label.
      - extendedWaitUntil:
          visible:
            id: "settings-appkit-networks"
          timeout: 5000
- tapOn:
    id: "settings-appkit-networks"
- extendedWaitUntil:
    visible:
      id: "siwx-switch"
    timeout: 10000
# The switch's label carries its state ("SIWX on" / "SIWX off").
- runFlow:
    when:
      visible: "SIWX on"
    commands:
      - tapOn:
          id: "siwx-switch"
      - extendedWaitUntil:
          visible: "SIWX off"
          timeout: 5000
- runFlow: connect_launch_dapp.yaml
