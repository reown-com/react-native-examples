appId: ${APP_ID}
---
# Shared flow: bring the dApp back to the front as it was (no restart). The
# wallet usually redirects back by itself (the dApp's metadata.redirect); this
# covers the case where it doesn't.
# iOS may be asking to open the dApp from the wallet's redirect.
- runFlow: connect_ios_open_prompt.yaml
- launchApp:
    appId: ${output.dappAppId}
    stopApp: false
